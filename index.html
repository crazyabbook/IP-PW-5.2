<!DOCTYPE html>
<html lang="ru">
    <head>
	    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>Калькулятор квадратных уравнений</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <link href="design.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container-fluid mt-5 d-flex flex-column align-items-center">
            <h1 class="fw-bold fst-italic text-center text-success">Решение квадратных уравнений</h1>
            <div id="formula" class="container mt-5 border rounded-4 col-6 bg-white">
                <div class="text-center fs-3 fst-italic">
                    ax<sup> 2</sup> + bx + c = 0
                </div>
            </div>
            <div class="row mt-5 justify-content-center g-3">
                <div class="col-auto d-flex align-items-center fs-3 fst-italic">
                    <span>a =</span>
                    <input id="inputA" type="number" class="form-control ms-2 border rounded-4 shadow-sm text-center fs-4">
                </div>
                <div class="col-auto d-flex align-items-center fs-3 fst-italic">
                    <span>b =</span>
                    <input id="inputB" type="number" class="form-control ms-2 border rounded-4 shadow-sm text-center fs-4">
                </div>
                <div class="col-auto d-flex align-items-center fs-3 fst-italic">
                    <span>c =</span>
                    <input id="inputC" type="number" class="form-control ms-2 border rounded-4 shadow-sm text-center fs-4">
                </div>
            </div>
            <button id="button" class="btn mt-5 rounded-4 col-3 fs-4 fst-italic btn-success">Решить</button>
            <div id="answer" class="container my-5 text-center fs-4 fw-bold fst-italic"></div>
        </div>
        <script src="file.js"></script>
    </body>
</html>
